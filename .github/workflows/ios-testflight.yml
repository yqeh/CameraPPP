name: iOS TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: Build and Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate secrets
        run: |
          test -n "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" || (echo "缺少 APP_STORE_CONNECT_KEY_ID" && exit 1)
          test -n "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" || (echo "缺少 APP_STORE_CONNECT_ISSUER_ID" && exit 1)
          test -n "${{ secrets.APP_STORE_CONNECT_KEY }}" || (echo "缺少 APP_STORE_CONNECT_KEY" && exit 1)

      - name: Import signing certificate (optional fallback)
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Build and upload via Fastlane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane beta

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CameraPPP-ipa
          path: build/CameraPPP.ipa
          if-no-files-found: ignore
          retention-days: 7
