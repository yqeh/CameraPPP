name: iOS TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: Build and Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane -N

      - name: Validate secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY_ID" ]; then
            echo "❌ 缺少 Secret: APP_STORE_CONNECT_KEY_ID"
            echo "請到 GitHub → Settings → Secrets → Actions 設定"
            exit 1
          fi
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "❌ 缺少 Secret: APP_STORE_CONNECT_ISSUER_ID"
            exit 1
          fi
          if [ -z "$APP_STORE_CONNECT_KEY" ]; then
            echo "❌ 缺少 Secret: APP_STORE_CONNECT_KEY"
            echo "請填入 .p8 檔案的 Base64 字串"
            exit 1
          fi
          echo "✅ Secrets 已設定"

      - name: Build and upload via Fastlane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: fastlane beta

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CameraPPP-ipa
          path: build/CameraPPP.ipa
          if-no-files-found: ignore
          retention-days: 7
